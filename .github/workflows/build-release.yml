name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6 and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgumbo-dev cmake build-essential

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package Linux binary
        run: |
          mkdir -p ULDictionary-Linux
          cp build/bin/ULDictionary ULDictionary-Linux/
          cp README.md ULDictionary-Linux/
          tar -czf ULDictionary-Linux-x86_64.tar.gz ULDictionary-Linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULDictionary-Linux
          path: ULDictionary-Linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtnetworkauth'

      - name: Install Gumbo
        run: |
          # Using vcpkg to install gumbo-parser
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat
          ./vcpkg install gumbo:x64-windows
          cd ..
        shell: cmd

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package Windows binary
        run: |
          mkdir ULDictionary-Windows
          copy build\bin\Release\ULDictionary.exe ULDictionary-Windows\
          copy README.md ULDictionary-Windows\
          # Copy Qt6 DLLs
          windeployqt ULDictionary-Windows\ULDictionary.exe
          # Create zip
          Compress-Archive -Path ULDictionary-Windows -DestinationPath ULDictionary-Windows-x86_64.zip
        shell: powershell

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULDictionary-Windows
          path: ULDictionary-Windows-x86_64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt6 and dependencies
        run: |
          brew install qt@6 gumbo-parser cmake

      - name: Configure CMake
        run: |
          export Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Package macOS binary
        run: |
          mkdir -p ULDictionary-macOS
          cp -r build/bin/ULDictionary.app ULDictionary-macOS/
          cp README.md ULDictionary-macOS/
          # Use macdeployqt to bundle Qt frameworks
          $(brew --prefix qt@6)/bin/macdeployqt ULDictionary-macOS/ULDictionary.app
          tar -czf ULDictionary-macOS-x86_64.tar.gz ULDictionary-macOS

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ULDictionary-macOS
          path: ULDictionary-macOS-x86_64.tar.gz

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/ULDictionary-Linux/ULDictionary-Linux-x86_64.tar.gz
            artifacts/ULDictionary-Windows/ULDictionary-Windows-x86_64.zip
            artifacts/ULDictionary-macOS/ULDictionary-macOS-x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
